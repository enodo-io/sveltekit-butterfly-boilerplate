# Quality gate of the boilerplate: lint (incl. the semantic HTML rules), types,
# unit tests, build + performance budget, then the e2e suite on the demo API
# (html-validate, SEO head contract, axe-core, route tests).
name: quality

on:
  push:
    branches: [master]
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: cp .env.example .env
      - run: npm run lint
      - run: npm run check
      - run: npm run test:unit -- --run
      - run: npm run build
      - run: npm run budget

  e2e:
    runs-on: ubuntu-latest
    needs: static
    env:
      # public key of the demo property (42): sent by every browser in
      # X-Butterfly-Key, read-only on published content, not a secret
      DEMO_API_KEY: 887bd55418b0edc23263e5a5296d6f26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: cp .env.example .env
      - run: sed -i "s|^PUBLIC_API_KEY=.*|PUBLIC_API_KEY=${DEMO_API_KEY}|" .env
      - run: npm run test:e2e
